<title>AurumScalp Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: trading-terminal shell — fixed left rail, dense card grid, gold as the only brand accent on a blue-black ground */
:root{
  --bg:#090D14; --rail:#0C111A; --surface:#111722; --surface2:#172030; --line:#222C3B; --line2:#1A2230;
  --text:#E7EBF1; --muted:#8B96A9; --faint:#5E687A;
  --gold:#E7B54A; --gold-ink:#1B1304; --gold-soft:rgba(231,181,74,.13);
  --good:#22C55E; --good-soft:rgba(34,197,94,.13); --bad:#EF4444; --bad-soft:rgba(239,68,68,.12); --warn:#F59E0B; --warn-soft:rgba(245,158,11,.13); --info:#60A5FA; --info-soft:rgba(96,165,250,.13);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--good)} .dn{color:var(--bad)} .mu{color:var(--muted)} .gd{color:var(--gold)}
h1,h2,h3{text-wrap:balance;margin:0}

/* prototype bar */
#protobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#05080D;border-bottom:1px solid var(--line);font-size:12px}
#protobar b{color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
#protobar .chips{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
#protobar .chips a{padding:3px 8px;border-radius:999px;color:var(--muted);border:1px solid transparent}
#protobar .chips a.on{color:var(--text);border-color:var(--line);background:var(--surface)}
#protobar .grp{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
#protobar .note{margin-left:auto;color:var(--faint)}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid transparent;padding:9px 14px;font-weight:700;font-size:12.5px;background:none;white-space:nowrap}
.btn.p{background:var(--gold);color:var(--gold-ink)} .btn.p:hover{filter:brightness(1.07)}
.btn.g{border-color:var(--line);color:var(--text)} .btn.g:hover{background:var(--surface2)}
.btn.dg{border-color:rgba(239,68,68,.4);color:#FCA5A5;background:var(--bad-soft)}
.btn.d{background:var(--bad);color:#fff}
.btn.w{width:100%} .btn.sm{padding:6px 10px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card>h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h4 .r{margin-left:auto;font-weight:500;color:var(--muted);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--good);background:var(--good-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.info{color:var(--info);background:var(--info-soft)} .pill.gold{color:var(--gold);background:var(--gold-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.inp{width:100%;background:#0B1119;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:13px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.tabs{display:inline-flex;gap:2px;background:#0B1119;border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:6px;color:var(--muted);font-size:11.5px;font-weight:600}
.tabs button.on{background:#243044;color:var(--text)}
.tog{width:32px;height:18px;border-radius:999px;background:#2A3446;position:relative;border:0;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--gold)} .tog.on::after{left:17px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.kv:last-child{border-bottom:0} .kv>span:first-child{color:var(--muted)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t .n{text-align:right}
table.t tr.click:hover td{background:var(--surface2);cursor:pointer}
.side-b{font-weight:800;font-size:10.5px;padding:2px 7px;border-radius:5px}
.side-b.buy{color:var(--good);background:var(--good-soft)} .side-b.sell{color:var(--bad);background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;margin-top:2px;color:var(--muted)}
.grid{display:grid;gap:12px}
.banner{display:flex;align-items:center;gap:10px;border-radius:9px;padding:10px 12px;font-size:12.5px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);border:1px solid rgba(245,158,11,.35);color:#FCD34D}
.banner.bad{background:var(--bad-soft);border:1px solid rgba(239,68,68,.35);color:#FCA5A5}
.banner.info{background:var(--info-soft);border:1px solid rgba(96,165,250,.35);color:#BFDBFE}
.banner .act{margin-left:auto;font-weight:700;background:none;border:0;color:inherit;text-decoration:underline}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#F6D98A,#C28A22);display:grid;place-items:center;color:var(--gold-ink);font-weight:800;font-size:14px}
.range{width:100%;accent-color:var(--gold)}

/* app shell */
.shell{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - 42px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:42px;height:calc(100vh - 42px)}
.rail .logo{margin:2px 6px 16px}
.rail a.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600}
.rail a.nav:hover{color:var(--text);background:var(--surface)}
.rail a.nav.on{background:var(--surface2);color:var(--text)}
.rail a.nav svg{width:16px;height:16px;flex:none}
.rail a.nav.on svg{color:var(--gold)}
.rail .plan{margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11.5px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:56px}
.top h1{font-size:17px;font-weight:700;margin-right:auto}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2B3547;display:grid;place-items:center;font-size:11px;font-weight:700;border:0}
.content{padding:18px 20px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bnav{display:none}

/* dashboard layout */
.dash-mid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
.dash-bot{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
#chart{width:100%;height:280px;display:block}
.feed{display:flex;flex-direction:column;max-height:250px;overflow:auto}
.feed div{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px}
.feed .ts{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);flex:none}
.feed .dt{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.stale{opacity:.5}

/* public pages */
.pub{max-width:1160px;margin:0 auto;padding-inline:20px;padding-block:0 40px}
.pnav{display:flex;align-items:center;gap:22px;padding-block:18px;flex-wrap:wrap}
.pnav a.l{color:var(--muted);font-weight:600}
.pnav .sp{margin-left:auto}
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:36px;align-items:center;padding-block:30px 26px}
.hero h1{font-size:clamp(30px,4.2vw,46px);line-height:1.08;letter-spacing:-.03em;font-weight:800}
.hero p{color:var(--muted);font-size:15px;max-width:48ch;margin:14px 0 0}
.fine{font-size:11.5px;color:var(--faint);margin-top:14px;max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan-c{display:flex;flex-direction:column;gap:10px;padding:20px}
.plan-c.pop{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.plan-c .price{font-size:34px;font-weight:800;letter-spacing:-.03em}
.plan-c ul{list-style:none;padding:0;margin:4px 0 8px;display:flex;flex-direction:column;gap:7px;flex:1}
.plan-c li::before{content:"✓";color:var(--gold);margin-right:8px;font-weight:800}
.foot{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;color:var(--faint);font-size:11.5px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 42px)}
.auth .brand{background:radial-gradient(circle at 25% 15%,#2B2210,var(--bg) 62%);border-right:1px solid var(--line);padding:36px;display:flex;flex-direction:column}
.auth .brand h2{font-size:24px;letter-spacing:-.02em;margin-top:16px}
.auth .form{display:flex;align-items:center;justify-content:center;padding:28px 20px}
.auth .box{width:100%;max-width:360px}
.auth .box h3{font-size:22px;letter-spacing:-.02em}
.otp{display:flex;gap:8px;margin:6px 0 16px}
.otp input{width:44px;height:50px;text-align:center;font-family:var(--f-mono);font-size:20px;background:#0B1119;border:1px solid var(--line);border-radius:9px}
.otp input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11.5px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#FCA5A5;font-size:12px;margin:-4px 0 10px}

/* onboarding */
.ob{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:22px 40px}
.stepper{display:flex;align-items:center;gap:8px;margin:18px 0 20px;flex-wrap:wrap}
.stepper button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--muted);font-weight:600}
.stepper .c{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid #2E3A4E}
.stepper button.done .c{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.stepper button.cur{color:var(--text)} .stepper button.cur .c{border:2px solid var(--gold);color:var(--gold)}
.stepper .ln{flex:1;min-width:16px;height:1px;background:#2E3A4E}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px}
.choice button.on{border-color:var(--gold);background:var(--gold-soft)}
.choice button b{display:block;font-size:13px} .choice button span{font-size:11.5px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--warn);border-top-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(3,6,10,.7);z-index:80;display:grid;place-items:center;padding:16px}
[hidden]{display:none!important}
#modal .mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:420px}
#modal h3{font-size:17px;margin-bottom:6px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:#1A2230;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast .dt{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:.3}}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:11px;font-variant-numeric:tabular-nums}
.heat td{text-align:center;padding:6px 0;border-radius:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:85;padding:18px;overflow:auto}

@media (max-width:980px){
  .dash-mid,.dash-bot{grid-template-columns:1fr}
  .hero,.auth{grid-template-columns:1fr}
  .auth .brand{display:none}
  .plans,.steps3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .content{padding:14px 16px 90px}
  .top{padding:10px 16px}
  .top .hide-s{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--rail);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600;min-width:52px}
  .bnav a.on{color:var(--gold)} .bnav svg{width:18px;height:18px}
  #protobar .chips{display:none}
  #protobar select{display:inline-block!important}
  #chart{height:220px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="protobar">
  <b>Prototype</b>
  <select id="jump" class="sel" style="display:none" aria-label="Jump to screen"></select>
  <div class="chips" id="chips"></div>
  <span class="note">Sample data · live-simulated prices</span>
</div>
<div id="root"></div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const fmt = (v, d=2) => Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (v, d=2) => (v>=0?"+":"") + fmt(v,d);
let seed = 42; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const pad = n => String(n).padStart(2,"0");
const clock = d => pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())+":"+pad(d.getUTCSeconds());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- state ---------------- */
const S = {
  authed:false, plan:"Pro", yearly:false, running:true, killed:false,
  price:3412.40, candles:[], positions:[], trades:[], activity:[],
  balance:12294.0, todayPnl:0, todayTrades:0, todayWins:0, spread:18, ping:4,
  preset:"Balanced", applied:true,
  risk:{risk:1.0, daily:3.0, spread:25, maxTrades:40, dd:8.0, maxLot:1.0, news:true, be:true, trail:true, asia:false},
  alerts:{}, ob:{step:3, mode:"self", bound:false, connected:false, preset:"Balanced"},
  tradeFilter:"all", tradeSearch:"", settingsTab:"Security", perfRange:"3M",
  accounts:[{login:"5102948", server:"ICMarkets-Live", type:"Live", status:"Running", ea:"v2.4.1"},{login:"7730215", server:"Pepperstone-Demo", type:"Demo", status:"Paper", ea:"v2.4.1"}],
  selAcct:"5102948", lastTick:Date.now()
};
// seed candle history
(function(){ let p = S.price - 6; for(let i=0;i<70;i++){ const o=p, c=o+gauss()*1.4+0.08; const h=Math.max(o,c)+Math.abs(gauss())*0.8, l=Math.min(o,c)-Math.abs(gauss())*0.8; S.candles.push({o,h,l,c}); p=c; } S.price = p; })();
// seed trade history
(function(){ const mods=["Momentum","Breakout","VWAP rev."]; let t = Date.now() - 3600e3*2; for(let i=0;i<46;i++){ const side = rnd()>.5?"BUY":"SELL", lots=[0.1,0.12,0.16,0.2][Math.floor(rnd()*4)], pts = gauss()*1.5+0.55, ent = 3400+rnd()*20; const pnl = pts*lots*100; t -= (60+rnd()*400)*1000; S.trades.push({t:new Date(t), side, lots, entry:ent, exit: side==="BUY"?ent+pts:ent-pts, pts, pnl, slip:Math.abs(gauss()*.3+.25), spread:14+Math.floor(rnd()*10), held:Math.floor(20+rnd()*200), module:mods[Math.floor(rnd()*3)], reason: pnl>30?"TP":pnl<-18?"SL":pnl>=0?"Trail":"Time stop"}); }
  const today = S.trades.slice(0,12); S.todayPnl = today.reduce((a,b)=>a+b.pnl,0); S.todayTrades = today.length; S.todayWins = today.filter(x=>x.pnl>0).length; })();
S.positions.push({id:1, side:"BUY", lots:0.16, entry:S.price-2.1, sl:1.6, tp:3.2, module:"Momentum", opened:Date.now()-50e3});
[["ok","TP hit +52.10 · held 1m 48s"],["warn","Entry skipped: spread 34 > 25"],["info","Preset Balanced v3 applied"],["bad","SL hit −26.40"]].forEach((a,i)=>S.activity.push({t:new Date(Date.now()-(i+1)*420e3), k:a[0], m:a[1]}));

/* ---------------- icons ---------------- */
const IC = {
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  acct:'<rect x="3" y="4" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.8"/>',
  perf:'<path d="M3 20h18M6 16l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  trades:'<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8"/>',
  bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/>',
  gear:'<circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.8"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="1.8"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ---------------- routing ---------------- */
const SCREENS = [
  ["Public", [["landing","Landing"],["pricing","Pricing"]]],

function equitySvg(w,h,sd,axis=true){ let s0=seed; seed=sd*7919; let v=10000; const pts=[]; for(let i=0;i<90;i++){ v+=gauss()*60+18; pts.push(v);} seed=s0;
 const mx=Math.max(...pts)*1.004, mn=Math.min(...pts)*.996, L=axis?46:0, B=axis?20:4; const X=i=>L+i/89*(w-L-6), Y=y=>6+(mx-y)/(mx-mn)*(h-B-8);
 const d="M"+pts.map((p,i)=>`${X(i).toFixed(1)} ${Y(p).toFixed(1)}`).join(" L"); const id="eq"+sd;
 let g=""; if(axis){ for(let k=0;k<4;k++){const yv=mn+(mx-mn)*k/3; g+=`<line x1="${L}" x2="${w}" y1="${Y(yv).toFixed(1)}" y2="${Y(yv).toFixed(1)}" stroke="var(--line2)"/><text x="0" y="${(Y(yv)+4).toFixed(1)}" font-size="10" fill="var(--muted)">${(yv/1000).toFixed(1)}k</text>`;} ["Jul","Aug","Sep"].forEach((m,i)=>g+=`<text x="${L+i*(w-L-30)/2}" y="${h-4}" font-size="10" fill="var(--muted)">${m}</text>`); }
 const last=pts[89]; return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Equity curve"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E7B54A" stop-opacity=".3"/><stop offset="1" stop-color="#E7B54A" stop-opacity="0"/></linearGradient></defs>${g}<path d="${d} L${X(89)} ${h-B} L${X(0)} ${h-B}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="#E7B54A" stroke-width="2"/><circle cx="${X(89)}" cy="${Y(last)}" r="3.5" fill="#E7B54A"/></svg>`; }
function barsSvg(w,h,vals,labels,pos="#22C55E"){ const mx=Math.max(...vals), mn=Math.min(0,...vals), sc=(h-22)/(mx-mn), z=6+mx*sc, bw=(w-4)/vals.length;
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Bar chart"><line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="var(--line)"/>${vals.map((v,i)=>{const bh=Math.abs(v)*sc; return `<rect x="${(2+i*bw+bw*.18).toFixed(1)}" y="${(v>=0?z-bh:z).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(1,bh).toFixed(1)}" rx="2" fill="${v>=0?pos:"#EF4444"}"><title>${labels[i]||i}: ${v}</title></rect>`+(labels[i]?`<text x="${(2+i*bw+bw/2).toFixed(1)}" y="${h-3}" font-size="9.5" fill="var(--muted)" text-anchor="middle">${labels[i]}</text>`:"")}).join("")}</svg>`; }

 const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; let s0=seed; seed=99;

 if(k==="accounts"){ const markDirty=()=>{ S.applied=false; $("#cfgState").innerHTML='<span class="pill warn dot">Unsaved changes</span>'; };
  const map={rRisk:"risk",rDaily:"daily",rSpread:"spread",rTrades:"maxTrades",rDd:"dd",rLot:"maxLot"};
  document.querySelectorAll(".range").forEach(r=>r.oninput=e=>{ const v=+e.target.value; S.risk[map[e.target.id]]=v; $("#"+e.target.id+"v").textContent=v+e.target.dataset.unit; markDirty(); });
  on("[data-rt]","click",e=>{ const key=e.currentTarget.dataset.rt; S.risk[key]=!S.risk[key]; e.currentTarget.classList.toggle("on"); markDirty(); });
  on("[data-preset2]","click",e=>{ S.preset=e.currentTarget.dataset.preset2; const P={Conservative:[0.5,20],Balanced:[1.0,40],Aggressive:[1.5,60],"Prop-Firm":[0.5,30]}[S.preset]; S.risk.risk=P[0]; S.risk.maxTrades=P[1]; if(S.preset==="Prop-Firm") S.risk.daily=4; S.applied=false; render(); });
  on("[data-acct]","click",e=>{ S.selAcct=e.currentTarget.dataset.acct; render(); });
  const aa=$("#addAcct"); if(aa) aa.onclick=()=>{ modal(`<h3>Bind another MT5 account</h3><div class="field"><label for="naL">MT5 login number</label><input class="inp mono" id="naL" placeholder="e.g. 8801234"></div><div class="field"><label for="naS">Broker server</label><select class="inp" id="naS"><option>Exness-MT5Real</option><option>ICMarketsSC-Live</option></select></div><div style="display:flex;gap:8px"><button class="btn g" style="flex:1" id="naC">Cancel</button><button class="btn p" style="flex:1" id="naOk">Bind account</button></div>`); $("#naC").onclick=closeModal; $("#naOk").onclick=()=>{ const l=$("#naL").value.trim(); if(!/^\d{5,10}$/.test(l)){ toast("Enter a 5 to 10 digit login","bad"); return; } S.accounts.push({login:l,server:$("#naS").value,type:"Live",status:"Waiting",ea:"—"}); closeModal(); toast("Account bound","ok","Start the EA on that terminal to connect"); render(); }; };
  $("#saveRisk").onclick=()=>{ $("#cfgState").innerHTML='<span class="pill warn dot">Pending</span>'; toast("Saved","warn","Waiting for the EA heartbeat…"); setTimeout(()=>{ S.applied=true; const c=$("#cfgState"); if(c) c.innerHTML='<span class="pill ok dot">Applied</span>'; S.activity.unshift({t:new Date(),k:"info",m:`Preset ${S.preset} applied · risk ${S.risk.risk}%`}); toast("Settings applied","ok",`EA confirmed ${S.preset} at ${clock(new Date())} UTC`); },2200); }; }
 if(k==="performance"){ on("#rangeTabs button","click",e=>{ S.perfRange=e.currentTarget.dataset.r; render(); }); $("#expPdf").onclick=()=>toast("Report generated","ok","Monthly statement is emailed in the real app"); }
 if(k==="trades"){ const refresh=()=>{ $("#tTable").innerHTML=tradeTable(); };
  $("#tSearch").oninput=e=>{ S.tradeSearch=e.target.value; refresh(); };
  on("#tFilter button","click",e=>{ S.tradeFilter=e.currentTarget.dataset.f; document.querySelectorAll("#tFilter button").forEach(b=>b.classList.toggle("on",b===e.currentTarget)); refresh(); });
  $("#csvBtn").onclick=()=>toast("CSV export","info",`${tradeRows().length} rows · downloads in the real app`);
  $("#tTable").addEventListener("click",e=>{ const r=e.target.closest("[data-tr]"); if(!r) return; const t=S.trades[+r.dataset.tr]; const dr=document.createElement("div"); dr.className="drawer"; dr.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="side-b ${t.side.toLowerCase()}">${t.side}</span><b style="font-size:16px">${fmt(t.lots)} lots XAUUSD</b><button class="btn sm g" style="margin-left:auto" id="drX">Close</button></div><div class="kpi"><div class="l">Result</div><div class="v ${t.pnl>=0?"up":"dn"}">${sgn(t.pnl)} USD</div></div><div style="margin-top:12px">${[["Closed",t.t.toUTCString().slice(5,25)+" UTC"],["Entry",fmt(t.entry)],["Exit",fmt(t.exit)],["Points",sgn(t.pts*100,0)],["Slippage",fmt(t.slip,1)+" pts"],["Spread at entry",t.spread+" pts"],["Held",Math.floor(t.held/60)+"m "+t.held%60+"s"],["Entry module",t.module],["Exit reason",t.reason]].map(x=>`<div class="kv"><span>${x[0]}</span><span class="mono">${x[1]}</span></div>`).join("")}</div><h4 style="margin:16px 0 8px">Order events</h4>${["Signal: momentum burst, 11 ticks in 4 s","Order sent · deviation 5 pts","Filled","Break-even moved at +1R",t.reason].map((x,i)=>`<div class="kv"><span class="mono">+${i*7}s</span><span>${x}</span></div>`).join("")}`; document.body.appendChild(dr); $("#drX").onclick=()=>dr.remove(); }); }
 if(k==="alerts"){ on("[data-al]","click",e=>{ const [i,c]=e.currentTarget.dataset.al.split("-").map(Number); const crit=i===2||i===3; const row=S.alerts[i]; if(crit && row[c] && row.filter(Boolean).length===1){ toast("Keep one channel on","warn","Critical alerts need at least one channel"); return; } row[c]=row[c]?0:1; e.currentTarget.classList.toggle("on"); });
  const tg=$("#tgBtn"); if(tg) tg.onclick=()=>{ tg.disabled=true; tg.textContent="Waiting for Telegram…"; setTimeout(()=>{ S.tg=true; toast("Telegram connected","ok","@umair_trades"); render(); },1600); }; }
 if(k==="billing"){ const up=$("#upBtn"); if(up) up.onclick=()=>{ modal(`<h3>Upgrade to Elite</h3><p class="mu">We will host your MT5 terminals. The change starts today.</p><div class="kv"><span>Elite</span><span class="mono">$199.00 / month</span></div><div class="kv"><span>Credit for unused Pro days</span><span class="mono up">−$34.48</span></div><div class="kv"><span>Due today (prorated)</span><span class="mono gd">$64.52</span></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn g" style="flex:1" id="uC">Not now</button><button class="btn p" style="flex:1" id="uOk">Pay $64.52 and upgrade</button></div>`); $("#uC").onclick=closeModal; $("#uOk").onclick=()=>{ S.plan="Elite"; closeModal(); toast("Upgraded to Elite","ok","Hosted setup is now in Accounts & EA"); render(); }; };
  $("#yrBtn").onclick=()=>toast("Yearly billing","info","Opens the payment provider's portal in the real app"); $("#payPortal").onclick=()=>toast("Payment portal","info","Opens the payment provider's portal in the real app"); const uc=$("#updCard"); if(uc) uc.onclick=()=>toast("Card update","info","Opens the payment provider's portal in the real app");
  const cb=$("#cancelBtn"); if(cb) cb.onclick=()=>{ modal(`<h3>Before you go</h3><p class="mu">What is the main reason? This helps us improve.</p><div class="choice" style="margin:10px 0">${["Too expensive","Results not good enough","Too hard to set up","Taking a break"].map(r=>`<button data-reason="${r}"><b style="font-size:12.5px">${r}</b></button>`).join("")}</div><div class="card" style="background:var(--surface2);margin-bottom:12px"><b>Pause for 1 month instead?</b><div class="mu" style="font-size:12px">No charge, your settings stay saved.</div></div><div style="display:flex;gap:8px"><button class="btn g" style="flex:1" id="pz">Pause 1 month</button><button class="btn dg" style="flex:1" id="cOk" disabled>Cancel plan</button></div>`); document.querySelectorAll("[data-reason]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-reason]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); $("#cOk").disabled=false; }); $("#pz").onclick=()=>{ closeModal(); toast("Plan paused","ok","Billing resumes on 1 Nov 2026"); }; $("#cOk").onclick=()=>{ S.cancelled=true; closeModal(); toast("Cancellation scheduled","warn","Access runs until 1 Oct 2026"); render(); }; };
  const un=$("#undoCancel"); if(un) un.onclick=()=>{ S.cancelled=false; toast("Your plan continues"); render(); }; }
 if(k==="settings"){ on("#setTabs button","click",e=>{ S.settingsTab=e.currentTarget.dataset.t; render(); }); }
 if(k==="admin"){ $("#cSearch").oninput=e=>{ $("#custT").innerHTML=custTable(e.target.value); }; }
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-saved]"); if(b) toast(b.dataset.saved||"Saved"); });
buildBar(); render();
})();
</script>
