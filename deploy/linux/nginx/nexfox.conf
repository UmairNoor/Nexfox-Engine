# NexFox Engine - one domain: dashboard at /, API at /api /ea /worker /ws /health /downloads.
# certbot --nginx adds the TLS server block and the HTTP->HTTPS redirect.
limit_req_zone $binary_remote_addr zone=nx_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nx_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nx_gateway:10m rate=30r/s;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream nexfox_api { server 127.0.0.1:8000; keepalive 32; }
upstream nexfox_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # nginx inherits proxy_set_header only into locations that set none of their own, so every location below relies
    # on this block (no per-location proxy_set_header) except /ws, which repeats the full set. The API uses
    # X-Forwarded-For for per-client rate limits and the audit log.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    location ~ ^/api/v1/auth/(login|signup|password|2fa|refresh|resend-code|verify-email) {
        limit_req zone=nx_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://nexfox_api;
    }
    location /api/ { limit_req zone=nx_api burst=40 nodelay; limit_req_status 429; proxy_pass http://nexfox_api; }
    location /ea/ { limit_req zone=nx_gateway burst=60 nodelay; limit_req_status 429; proxy_pass http://nexfox_api; }
    location /worker/ { limit_req zone=nx_gateway burst=60 nodelay; limit_req_status 429; proxy_pass http://nexfox_api; }
    location /health { proxy_pass http://nexfox_api; }
    location /downloads/ { proxy_pass http://nexfox_api; }
    location = /ws {
        proxy_pass http://nexfox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        access_log off;   # the URL carries a 60-second ticket; keep it out of logs anyway
    }
    location / { proxy_pass http://nexfox_web; }
}
